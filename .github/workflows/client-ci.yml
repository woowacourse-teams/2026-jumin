name: Client CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main
    paths:
      - "client/**"
      - ".github/workflows/client-dev-cd.yml"
      - ".github/workflows/client-prod-cd.yml"
      - ".github/workflows/client-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Client checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Check client
        working-directory: client
        run: pnpm check

      - name: Install Playwright Chromium
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium

      - name: Run client E2E
        id: e2e
        working-directory: client
        env:
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
        run: |
          test -n "$NAVER_MAP_CLIENT_ID"
          pnpm test:e2e

      - name: Upload E2E failure artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v5
        with:
          name: client-e2e-failure
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore

      - name: Notify Discord of E2E failure
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        shell: bash
        env:
          DISCORD_E2E_WEBHOOK_URL: ${{ secrets.DISCORD_E2E_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_E2E_WEBHOOK_URL" ]]; then
            echo "Discord webhook secret unavailable"
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          screenshot="$(find client/test-results -type f -name '*.png' -print -quit 2>/dev/null || true)"

          curl_args=(--fail-with-body --silent --show-error
            --form-string "content=Client E2E 실패: ${run_url}")

          if [[ -n "$screenshot" ]]; then
            curl_args+=(-F "files[0]=@${screenshot}")
          fi

          curl "${curl_args[@]}" "$DISCORD_E2E_WEBHOOK_URL"

      - name: Build client
        working-directory: client
        env:
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
        run: pnpm build:webpack

      - name: Validate build output
        working-directory: client
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -print -quit)"

  storybook:
    name: Storybook build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Validate Storybook output
        run: |
          test -s storybook-static/index.html
          test -s storybook-static/iframe.html
          test -s storybook-static/index.json
