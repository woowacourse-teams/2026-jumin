name: Client CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main
    paths:
      - "client/**"
      - ".github/workflows/client-dev-cd.yml"
      - ".github/workflows/client-prod-cd.yml"
      - ".github/workflows/client-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Client checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Select affected client tests
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node client/scripts/select-affected-tests.mjs

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Check client types and style
        working-directory: client
        run: |
          pnpm typecheck
          pnpm exec eslint .
          pnpm exec prettier --check .

      - name: Run client unit tests
        working-directory: client
        run: pnpm test:unit

      - name: Run affected integration tests
        if: ${{ steps.select.outputs.jest_mode != 'skip' }}
        shell: bash
        working-directory: client
        env:
          JEST_MODE: ${{ steps.select.outputs.jest_mode }}
        run: |
          set -Eeuo pipefail

          if [[ "$JEST_MODE" == "all" ]]; then
            pnpm test:integration
          elif [[ "$JEST_MODE" == "files" ]]; then
            mapfile -t selected_tests < "$RUNNER_TEMP/jest-files.txt"
            test "${#selected_tests[@]}" -gt 0
            pnpm test:integration --runTestsByPath "${selected_tests[@]}"
          else
            echo "Unknown Jest selection mode: $JEST_MODE" >&2
            exit 1
          fi

      - name: Run client E2E
        if: ${{ steps.select.outputs.e2e_mode != 'skip' }}
        id: e2e
        working-directory: client
        env:
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
          E2E_MODE: ${{ steps.select.outputs.e2e_mode }}
          E2E_PATTERN: ${{ steps.select.outputs.e2e_pattern }}
        run: |
          set -Eeuo pipefail

          test -n "$NAVER_MAP_CLIENT_ID"
          if [[ "$E2E_MODE" == "all" ]]; then
            pnpm test:e2e
          elif [[ "$E2E_MODE" == "tags" && -n "$E2E_PATTERN" ]]; then
            pnpm test:e2e --grep "$E2E_PATTERN"
          else
            echo "Invalid E2E selection: $E2E_MODE / $E2E_PATTERN" >&2
            exit 1
          fi

      - name: Upload E2E failure artifacts
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v5
        with:
          name: client-e2e-failure
          path: |
            client/test-results/
            client/playwright-report/
          if-no-files-found: ignore

      - name: Notify Discord of E2E failure
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        shell: bash
        env:
          DISCORD_E2E_WEBHOOK_URL: ${{ secrets.DISCORD_E2E_WEBHOOK_URL }}
        run: |
          if [[ -z "$DISCORD_E2E_WEBHOOK_URL" ]]; then
            echo "Discord webhook secret unavailable"
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          screenshot="$(find client/test-results -type f -name '*.png' -print -quit 2>/dev/null || true)"

          curl_args=(--fail-with-body --silent --show-error
            --form-string "content=Client E2E 실패: ${run_url}")

          if [[ -n "$screenshot" ]]; then
            curl_args+=(-F "files[0]=@${screenshot}")
          fi

          curl "${curl_args[@]}" "$DISCORD_E2E_WEBHOOK_URL"

      - name: Build client
        working-directory: client
        env:
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
        run: pnpm build:webpack

      - name: Validate build output
        working-directory: client
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -print -quit)"

  storybook:
    name: Storybook build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Validate Storybook output
        run: |
          test -s storybook-static/index.html
          test -s storybook-static/iframe.html
          test -s storybook-static/index.json
