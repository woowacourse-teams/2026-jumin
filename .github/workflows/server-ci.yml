name: Server CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'server/**'
      - 'infra/docker-compose.local.yml'
      - 'infra/docker-compose.dev.yml'
      - 'infra/docker-compose.prod.yml'
      - 'infra/docker-compose.viewport.yml'
      - 'infra/docker-compose.proxy.yml'
      - 'infra/docker-compose.proxy.prod.yml'
      - 'infra/nginx/bootstrap.conf'
      - 'infra/nginx/bootstrap.prod.conf'
      - 'infra/nginx/jumin.conf'
      - 'infra/nginx/jumin.prod.conf'
      - 'infra/scripts/validate-admin-auth-env.sh'
      - 'infra/scripts/viewport-cache*.sh'
      - 'infra/scripts/deploy-backend.sh'
      - 'infra/scripts/mark-viewport-compatible-image.sh'
      - 'infra/scripts/provision-viewport-db.py'
      - 'infra/scripts/tests/**'
      - 'infra/scripts/renew-certificates.sh'
      - 'infra/scripts/renew-certificates-prod.sh'
      - 'server/Dockerfile'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/server-dev-cd.yml'
      - '.github/workflows/server-prod-cd.yml'
      - '.github/workflows/proxy-dev-cd.yml'
      - '.github/workflows/proxy-prod-cd.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'server/**'
      - 'infra/docker-compose.local.yml'
      - 'infra/docker-compose.dev.yml'
      - 'infra/docker-compose.prod.yml'
      - 'infra/docker-compose.viewport.yml'
      - 'infra/docker-compose.proxy.yml'
      - 'infra/docker-compose.proxy.prod.yml'
      - 'infra/nginx/bootstrap.conf'
      - 'infra/nginx/bootstrap.prod.conf'
      - 'infra/nginx/jumin.conf'
      - 'infra/nginx/jumin.prod.conf'
      - 'infra/scripts/validate-admin-auth-env.sh'
      - 'infra/scripts/viewport-cache*.sh'
      - 'infra/scripts/deploy-backend.sh'
      - 'infra/scripts/mark-viewport-compatible-image.sh'
      - 'infra/scripts/provision-viewport-db.py'
      - 'infra/scripts/tests/**'
      - 'infra/scripts/renew-certificates.sh'
      - 'infra/scripts/renew-certificates-prod.sh'
      - 'server/Dockerfile'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/server-dev-cd.yml'
      - '.github/workflows/server-prod-cd.yml'
      - '.github/workflows/proxy-dev-cd.yml'
      - '.github/workflows/proxy-prod-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate admin authentication script syntax
        run: |
          for script in infra/scripts/validate-admin-auth-env.sh infra/scripts/viewport-cache*.sh infra/scripts/deploy-backend.sh infra/scripts/mark-viewport-compatible-image.sh infra/scripts/tests/test-viewport-cache.sh; do
            bash -n "$script"
          done

      - name: Verify isolated viewport DB role provisioning
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client
          fi
          python3 infra/scripts/tests/test-provision-viewport-db.py

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run server checks
        working-directory: server
        run: ./gradlew clean check bootJar

      - name: Prepare Docker build context
        working-directory: server
        shell: bash
        run: |
          set -Eeuo pipefail

          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "${jar_file}"
          test -s "${jar_file}"

          mkdir -p "${RUNNER_TEMP}/jumin-backend-image-context"
          cp "${jar_file}" "${RUNNER_TEMP}/jumin-backend-image-context/app.jar"

      - name: Validate backend Docker image build
        run: docker build --file server/Dockerfile --build-arg "APP_COMMIT_SHA=${GITHUB_SHA}" --tag jumin-backend:ci "${RUNNER_TEMP}/jumin-backend-image-context"

      - name: Validate viewport deployment contracts
        env:
          VIEWPORT_TEST_IMAGE: jumin-backend:ci
        run: bash infra/scripts/tests/test-viewport-cache.sh

      - name: Validate Docker Compose configuration
        env:
          DB_URL: jdbc:postgresql://localhost:5432/jumin
          DB_USERNAME: ci
          DB_PASSWORD: ci
          LOCAL_SEARCH_REST_API_KEY: ci
          REVERSE_GEOCODING_CLIENT_ID: ci
          REVERSE_GEOCODING_CLIENT_SECRET: ci
          ADMIN_LOGIN_ID: ci-admin
          ADMIN_PASSWORD_HASH: ci-password-hash-placeholder
          ADMIN_TOKEN_SECRET: ci-token-secret-placeholder-32-bytes
          ADMIN_ENV_LABEL: ci
          PARKING_AVAILABILITY_ENABLED: 'false'
          SEOUL_PARKING_API_KEY: ''
          BUSAN_PARKING_API_KEY: ''
        run: docker compose --file infra/docker-compose.dev.yml config --quiet

      - name: Validate production Docker Compose configuration
        env:
          DB_URL: jdbc:postgresql://localhost:5432/jumin
          DB_USERNAME: ci
          DB_PASSWORD: ci
          LOCAL_SEARCH_REST_API_KEY: ci
          REVERSE_GEOCODING_CLIENT_ID: ci
          REVERSE_GEOCODING_CLIENT_SECRET: ci
          ADMIN_LOGIN_ID: ci-admin
          ADMIN_PASSWORD_HASH: ci-password-hash-placeholder
          ADMIN_TOKEN_SECRET: ci-token-secret-placeholder-32-bytes
          ADMIN_ENV_LABEL: ci
          PARKING_AVAILABILITY_ENABLED: 'false'
          SEOUL_PARKING_API_KEY: ''
          BUSAN_PARKING_API_KEY: ''
        run: docker compose --file infra/docker-compose.prod.yml config --quiet

      - name: Validate development proxy Compose configuration
        run: docker compose --file infra/docker-compose.proxy.yml config --quiet

      - name: Validate production proxy Compose configuration
        run: docker compose --file infra/docker-compose.proxy.prod.yml config --quiet
