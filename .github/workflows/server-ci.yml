name: Server CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'server/**'
      - 'infra/docker-compose.local.yml'
      - 'infra/docker-compose.dev.yml'
      - 'infra/docker-compose.prod.yml'
      - 'infra/docker-compose.viewport.yml'
      - 'infra/docker-compose.viewport.prod.yml'
      - 'infra/docker-compose.proxy.yml'
      - 'infra/docker-compose.proxy.prod.yml'
      - 'infra/nginx/bootstrap.conf'
      - 'infra/nginx/bootstrap.prod.conf'
      - 'infra/nginx/jumin.conf'
      - 'infra/nginx/jumin.prod.conf'
      - 'infra/scripts/validate-admin-auth-env.sh'
      - 'infra/scripts/deploy-backend.sh'
      - 'infra/scripts/validate-rollback-settings.py'
      - 'infra/scripts/drain-backend.sh'
      - 'infra/redis/**'
      - 'infra/scripts/tests/**'
      - 'infra/scripts/renew-certificates.sh'
      - 'infra/scripts/renew-certificates-prod.sh'
      - 'server/Dockerfile'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/server-dev-cd.yml'
      - '.github/workflows/server-prod-cd.yml'
      - '.github/workflows/proxy-dev-cd.yml'
      - '.github/workflows/proxy-prod-cd.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'server/**'
      - 'infra/docker-compose.local.yml'
      - 'infra/docker-compose.dev.yml'
      - 'infra/docker-compose.prod.yml'
      - 'infra/docker-compose.viewport.yml'
      - 'infra/docker-compose.viewport.prod.yml'
      - 'infra/docker-compose.proxy.yml'
      - 'infra/docker-compose.proxy.prod.yml'
      - 'infra/nginx/bootstrap.conf'
      - 'infra/nginx/bootstrap.prod.conf'
      - 'infra/nginx/jumin.conf'
      - 'infra/nginx/jumin.prod.conf'
      - 'infra/scripts/validate-admin-auth-env.sh'
      - 'infra/scripts/deploy-backend.sh'
      - 'infra/scripts/validate-rollback-settings.py'
      - 'infra/scripts/drain-backend.sh'
      - 'infra/redis/**'
      - 'infra/scripts/tests/**'
      - 'infra/scripts/renew-certificates.sh'
      - 'infra/scripts/renew-certificates-prod.sh'
      - 'server/Dockerfile'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/server-dev-cd.yml'
      - '.github/workflows/server-prod-cd.yml'
      - '.github/workflows/proxy-dev-cd.yml'
      - '.github/workflows/proxy-prod-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate admin authentication script syntax
        run: |
          for script in infra/scripts/validate-admin-auth-env.sh infra/scripts/tests/test-viewport-cache.sh; do
            bash -n "$script"
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run server checks
        working-directory: server
        run: ./gradlew clean check bootJar

      - name: Prepare Docker build context
        working-directory: server
        shell: bash
        run: |
          set -Eeuo pipefail

          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "${jar_file}"
          test -s "${jar_file}"

          mkdir -p "${RUNNER_TEMP}/jumin-backend-image-context"
          cp "${jar_file}" "${RUNNER_TEMP}/jumin-backend-image-context/app.jar"

      - name: Validate backend Docker image build
        run: docker build --file server/Dockerfile --build-arg "APP_COMMIT_SHA=${GITHUB_SHA}" --tag jumin-backend:ci "${RUNNER_TEMP}/jumin-backend-image-context"

      - name: Validate viewport deployment contracts
        run: bash infra/scripts/tests/test-viewport-cache.sh

      - name: Validate backend slots and Redis TLS Compose configuration
        shell: bash
        env:
          DB_URL: jdbc:postgresql://localhost:5432/jumin
          DB_USERNAME: ci
          DB_PASSWORD: ci
          LOCAL_SEARCH_REST_API_KEY: ci
          REVERSE_GEOCODING_CLIENT_ID: ci
          REVERSE_GEOCODING_CLIENT_SECRET: ci
          ADMIN_LOGIN_ID: ci-admin
          ADMIN_PASSWORD_HASH: ci-password-hash-placeholder
          ADMIN_TOKEN_SECRET: ci-token-secret-placeholder-32-bytes
          ADMIN_ENV_LABEL: ci
          PARKING_AVAILABILITY_ENABLED: 'false'
          SEOUL_PARKING_API_KEY: ''
          BUSAN_PARKING_API_KEY: ''
        run: |
          for environment in dev prod; do
            compose_file="infra/docker-compose.$environment.yml"
            overlay=infra/docker-compose.viewport.yml
            if [[ "$environment" == prod ]]; then
              overlay=infra/docker-compose.viewport.prod.yml
            fi
            docker compose --file "$compose_file" config --quiet
            BACKEND_NETWORK_EXTERNAL=true VIEWPORT_REDIS_TLS_CA_PATH=/tmp/jumin-redis-ca.pem \
              docker compose --file "$compose_file" --file "$overlay" \
                --profile blue-green config --format json |
              python3 -c '
          import json, sys
          config = json.load(sys.stdin)
          if sys.argv[1] == "prod":
              assert config["networks"]["default"]["external"]
              backend_environment = config["services"]["backend"]["environment"]
              slots = {"backend-blue": "blue", "backend-green": "green"}
              services = ("backend", *slots)
              for name, slot in slots.items():
                  service = config["services"][name]
                  assert not service.get("ports"), name
                  assert service["environment"].get("BACKEND_SLOT") == slot, name
                  assert backend_environment.items() <= service["environment"].items(), name
          else:
              assert set(config["services"]) == {"backend"}
              assert config["services"]["backend"]["ports"][0]["host_ip"] == "127.0.0.1"
              services = ("backend",)
          for name in services:
              service = config["services"][name]
              assert any(volume["target"] == "/app/redis-ca.pem" and volume["read_only"]
                         for volume in service["volumes"]), name
          ' "$environment"
          done

      - name: Validate development proxy Compose configuration
        run: docker compose --file infra/docker-compose.proxy.yml config --quiet

      - name: Validate production proxy Compose configuration
        run: docker compose --file infra/docker-compose.proxy.prod.yml config --quiet
