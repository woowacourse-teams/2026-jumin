name: Deploy server development

on:
  push:
    branches:
      - develop
    paths:
      - 'server/**'
      - 'infra/docker-compose.dev.yml'
      - 'server/Dockerfile'
      - '.github/workflows/server-dev-cd.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build server delivery artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run server checks
        working-directory: server
        run: ./gradlew clean check bootJar

      - name: Prepare server artifact
        working-directory: server
        shell: bash
        run: |
          set -Eeuo pipefail

          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "${jar_file}"
          test -s "${jar_file}"

          mkdir -p "${RUNNER_TEMP}/jumin-backend-delivery"
          cp "${jar_file}" "${RUNNER_TEMP}/jumin-backend-delivery/app.jar"
          (
            cd "${RUNNER_TEMP}/jumin-backend-delivery"
            sha256sum app.jar > app.jar.sha256
          )

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-development-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jumin-backend-delivery
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy server development
    if: github.ref == 'refs/heads/develop'
    needs: build
    environment: development
    runs-on: [self-hosted, Linux, ARM64, jumin-dev]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download server artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-development-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jumin-dev-deploy/backend

      - name: Deploy backend with Docker Compose
        shell: bash
        env:
          BACKEND_ARTIFACT_DIR: ${{ runner.temp }}/jumin-dev-deploy/backend
          BACKEND_RELEASE_ROOT: /opt/jumin-dev/backend
          BACKEND_PORT: '8080'
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          LOCAL_SEARCH_CLIENT_ID: ${{ secrets.LOCAL_SEARCH_CLIENT_ID }}
          LOCAL_SEARCH_CLIENT_SECRET: ${{ secrets.LOCAL_SEARCH_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail

          repository_root="${GITHUB_WORKSPACE:-$PWD}"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_root="${BACKEND_RELEASE_ROOT}"
          release_dir="${release_root}/releases/${release_id}"
          current_link="${release_root}/current"
          compose_file="${repository_root}/infra/docker-compose.dev.yml"
          image_name="jumin-backend"
          previous_image="$(docker inspect --format '{{.Config.Image}}' jumin-backend-dev 2>/dev/null || true)"
          previous_tag=""
          if [[ "${previous_image}" == "${image_name}:"* ]]; then
            previous_tag="${previous_image#${image_name}:}"
          fi

          test -s "${BACKEND_ARTIFACT_DIR}/app.jar"
          if [[ -f "${BACKEND_ARTIFACT_DIR}/app.jar.sha256" ]]; then
            (
              cd "${BACKEND_ARTIFACT_DIR}"
              sha256sum --check app.jar.sha256
            )
          fi

          mkdir -p "${release_dir}"
          cp "${BACKEND_ARTIFACT_DIR}/app.jar" "${release_dir}/app.jar"
          if [[ -f "${BACKEND_ARTIFACT_DIR}/app.jar.sha256" ]]; then
            cp "${BACKEND_ARTIFACT_DIR}/app.jar.sha256" "${release_dir}/app.jar.sha256"
          fi

          ln -sfn "${release_dir}" "${current_link}"
          docker build \
            --file "${repository_root}/server/Dockerfile" \
            --tag "${image_name}:${release_id}" \
            "${release_dir}"

          compose_up() {
            local image_tag="$1"

            IMAGE_TAG="${image_tag}" \
            BACKEND_PORT="${BACKEND_PORT}" \
            DB_URL="${DB_URL}" \
            DB_USERNAME="${DB_USERNAME}" \
            DB_PASSWORD="${DB_PASSWORD}" \
            LOCAL_SEARCH_CLIENT_ID="${LOCAL_SEARCH_CLIENT_ID}" \
            LOCAL_SEARCH_CLIENT_SECRET="${LOCAL_SEARCH_CLIENT_SECRET}" \
            docker compose \
              --project-name jumin-dev \
              --file "${compose_file}" \
              up --detach --no-deps --remove-orphans backend
          }

          compose_up "${release_id}"

          health_url="http://127.0.0.1:${BACKEND_PORT}/actuator/health"
          for _ in $(seq 1 12); do
            if curl --noproxy '*' --fail --silent --show-error "${health_url}" >/dev/null; then
              echo "Backend development deployment succeeded: ${release_id}"
              exit 0
            fi
            sleep 5
          done

          echo "Backend health check failed. Recent container logs:" >&2
          docker compose \
            --project-name jumin-dev \
            --file "${compose_file}" \
            logs --tail=80 backend >&2 || true

          if [[ -n "${previous_tag}" && "${previous_tag}" != "${release_id}" ]]; then
            echo "Restoring previous backend image: ${previous_tag}" >&2
            compose_up "${previous_tag}" || true
          else
            docker compose \
              --project-name jumin-dev \
              --file "${compose_file}" \
              down --remove-orphans || true
          fi

          exit 1
