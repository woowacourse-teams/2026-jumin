name: Deploy server development

on:
  push:
    branches:
      - develop
    paths:
      - 'server/**'
      - 'infra/docker-compose.dev.yml'
      - 'infra/docker-compose.viewport.yml'
      - 'infra/scripts/deploy-backend.sh'
      - 'infra/scripts/viewport-cache*.sh'
      - 'infra/scripts/mark-viewport-compatible-image.sh'
      - 'infra/scripts/validate-admin-auth-env.sh'
      - 'server/Dockerfile'
      - 'infra/observability/alloy/**'
      - 'infra/observability/scripts/deploy-alloy.sh'
      - 'infra/observability/scripts/install-credentials.sh'
      - '.github/workflows/server-dev-cd.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build server delivery artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate viewport deployment contracts
        run: bash infra/scripts/tests/test-viewport-cache.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run server checks
        working-directory: server
        run: ./gradlew clean check bootJar

      - name: Prepare server artifact
        working-directory: server
        shell: bash
        run: |
          set -Eeuo pipefail

          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "${jar_file}"
          test -s "${jar_file}"

          mkdir -p "${RUNNER_TEMP}/jumin-backend-delivery"
          cp "${jar_file}" "${RUNNER_TEMP}/jumin-backend-delivery/app.jar"
          (
            cd "${RUNNER_TEMP}/jumin-backend-delivery"
            sha256sum app.jar > app.jar.sha256
          )

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-development-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jumin-backend-delivery
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy server development
    if: github.ref == 'refs/heads/develop'
    needs: build
    environment: development
    runs-on: [self-hosted, Linux, ARM64, jumin-dev]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate admin authentication configuration
        shell: bash
        env:
          ADMIN_LOGIN_ID: ${{ secrets.ADMIN_LOGIN_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN_SECRET }}
        run: bash infra/scripts/validate-admin-auth-env.sh

      - name: Download server artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-development-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/jumin-dev-deploy/backend

      - name: Deploy backend with Docker Compose
        shell: bash
        env:
          BACKEND_ARTIFACT_DIR: ${{ runner.temp }}/jumin-dev-deploy/backend
          BACKEND_RELEASE_ROOT: /opt/jumin-dev/backend
          BACKEND_PORT: '8080'
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          LOCAL_SEARCH_CLIENT_ID: ${{ secrets.LOCAL_SEARCH_CLIENT_ID }}
          LOCAL_SEARCH_CLIENT_SECRET: ${{ secrets.LOCAL_SEARCH_CLIENT_SECRET }}
          REVERSE_GEOCODING_CLIENT_ID: ${{ secrets.REVERSE_GEOCODING_CLIENT_ID }}
          REVERSE_GEOCODING_CLIENT_SECRET: ${{ secrets.REVERSE_GEOCODING_CLIENT_SECRET }}
          ADMIN_LOGIN_ID: ${{ secrets.ADMIN_LOGIN_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN_SECRET }}
          ADMIN_ENV_LABEL: dev
        run: bash infra/scripts/deploy-backend.sh dev

      - name: Deploy Alloy collector
        env:
          OBSERVABILITY_INGEST_PASSWORD: ${{ secrets.OBSERVABILITY_INGEST_PASSWORD }}
        run: |
          bash infra/observability/scripts/install-credentials.sh collector /opt/jumin-alloy
          bash infra/observability/scripts/deploy-alloy.sh dev
