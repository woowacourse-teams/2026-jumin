allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  msw: true
  unrs-resolver: false

overrides:
  shell-quote: 1.11.0

# https://github.com/pnpm/pnpm/pull/17443
# shortcut: 4.3.1은 버전 기반 보안 경고가 남으므로 공식 수정 버전 출시 시 패치를 제거한다.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  # Storybook 빌더의 6.x 호환성을 유지하며 공식 출력 경로 검증을 역적용한다.
  # https://github.com/webpack/webpack-dev-middleware/blob/v7.4.6/src/utils/getFilenameFromUrl.js
  webpack-dev-middleware@6.1.3: patches/webpack-dev-middleware@6.1.3.patch
