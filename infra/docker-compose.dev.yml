name: jumin-dev

services:
  backend:
    image: jumin-backend:${IMAGE_TAG:-dev}
    container_name: jumin-backend-dev
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: jumin-dev/{{.Name}}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      LOG_ENVIRONMENT: dev
      TZ: Asia/Seoul
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LOCAL_SEARCH_REST_API_KEY: ${LOCAL_SEARCH_REST_API_KEY:?LOCAL_SEARCH_REST_API_KEY is required}
      REVERSE_GEOCODING_CLIENT_ID: ${REVERSE_GEOCODING_CLIENT_ID:?REVERSE_GEOCODING_CLIENT_ID is required}
      REVERSE_GEOCODING_CLIENT_SECRET: ${REVERSE_GEOCODING_CLIENT_SECRET:?REVERSE_GEOCODING_CLIENT_SECRET is required}
      ADMIN_LOGIN_ID: ${ADMIN_LOGIN_ID:?ADMIN_LOGIN_ID is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?ADMIN_TOKEN_SECRET is required}
      ADMIN_ENV_LABEL: ${ADMIN_ENV_LABEL:?ADMIN_ENV_LABEL is required}
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      JUMIN_VIEWPORT_CACHE_ENABLED: ${JUMIN_VIEWPORT_CACHE_ENABLED:-false}
      JUMIN_VIEWPORT_CACHE_ENVIRONMENT: ${JUMIN_VIEWPORT_CACHE_ENVIRONMENT:-dev_sq_disabled}
      JUMIN_VIEWPORT_CACHE_REDISURI: ${JUMIN_VIEWPORT_CACHE_REDISURI:-redis://127.0.0.1:56379}
      JUMIN_VIEWPORT_CACHE_REDISUSERNAME: ${JUMIN_VIEWPORT_CACHE_REDISUSERNAME:-}
      JUMIN_VIEWPORT_CACHE_REDISPASSWORD: ${JUMIN_VIEWPORT_CACHE_REDISPASSWORD:-}
      JUMIN_VIEWPORT_CACHE_REDISTLSCAFILE: ${JUMIN_VIEWPORT_CACHE_REDISTLSCAFILE:-}
      JUMIN_VIEWPORT_CACHE_TTL: ${JUMIN_VIEWPORT_CACHE_TTL:-10m}
      JUMIN_VIEWPORT_CACHE_EMPTYTTL: ${JUMIN_VIEWPORT_CACHE_EMPTYTTL:-1m}
      JUMIN_VIEWPORT_CACHE_TTLJITTER: ${JUMIN_VIEWPORT_CACHE_TTLJITTER:-0.2}
      JUMIN_VIEWPORT_CACHE_MAXCONCURRENTREQUESTS: '0'
      JUMIN_VIEWPORT_CACHE_PREPAREONSTARTUP: ${JUMIN_VIEWPORT_CACHE_PREPAREONSTARTUP:-false}
      PARKING_AVAILABILITY_ENABLED: ${PARKING_AVAILABILITY_ENABLED}
      SEOUL_PARKING_API_KEY: ${SEOUL_PARKING_API_KEY}
      BUSAN_PARKING_API_KEY: ${BUSAN_PARKING_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
