name: jumin-prod

services:
  backend:
    image: jumin-backend:${IMAGE_TAG:-prod}
    container_name: jumin-backend-prod
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /jumin/prod/backend
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 10m
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LOCAL_SEARCH_CLIENT_ID: ${LOCAL_SEARCH_CLIENT_ID:?LOCAL_SEARCH_CLIENT_ID is required}
      LOCAL_SEARCH_CLIENT_SECRET: ${LOCAL_SEARCH_CLIENT_SECRET:?LOCAL_SEARCH_CLIENT_SECRET is required}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
