name: jumin-proxy

services:
  nginx:
    image: nginx:1.29.8-alpine
    container_name: jumin-nginx-dev
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - '${NGINX_CONF_FILE:-./nginx/jumin.conf}:/etc/nginx/conf.d/default.conf:ro'
      - '/var/www/jumin-dev:/var/www/jumin-dev:ro'
      - '/opt/jumin-dev/certbot/www:/var/www/certbot:ro'
      - '/opt/jumin-dev/certbot/conf:/etc/letsencrypt:ro'
    networks:
      - jumin-dev

  certbot:
    image: certbot/certbot:v5.7.0
    profiles:
      - certificate
    volumes:
      - '/opt/jumin-dev/certbot/www:/var/www/certbot'
      - '/opt/jumin-dev/certbot/conf:/etc/letsencrypt'
    networks:
      - jumin-dev

networks:
  jumin-dev:
    name: jumin-dev_default
    external: true
