server_tokens off;

resolver 127.0.0.11 valid=30s ipv6=off;

map $host $backend_upstream {
    default http://backend:8080;
    include /etc/nginx/backend-routing/*.conf;
}

# 호스트 loopback에만 게시하는 배포 확인 및 Alloy 수집 포트.
server {
    listen 18080;
    access_log off;

    location = /route {
        add_header X-Jumin-Backend $backend_upstream;
        return 204;
    }

    location = /health {
        proxy_pass $backend_upstream/actuator/health;
        proxy_hide_header X-Jumin-Backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header X-Jumin-Backend $backend_upstream always;
    }

    location = /actuator/prometheus {
        proxy_pass $backend_upstream/actuator/prometheus;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name origin.jucha.info;

    root /var/www/jumin-prod/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/admin/parking/csv/import {
        client_max_body_size 31m;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
