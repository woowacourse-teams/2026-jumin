server_tokens off;

map $status $log_5xx {
    default 0;
    ~^5 1;
}

log_format proxy_5xx escape=json
    '{"timestamp":"$time_iso8601","event":"proxy_5xx","environment":"loadtest-local",'
    '"method":"$request_method","status":$status,"upstreamStatus":"$upstream_status",'
    '"upstreamAddr":"$upstream_addr","durationSec":$request_time,'
    '"upstreamConnectSec":"$upstream_connect_time",'
    '"upstreamDurationSec":"$upstream_response_time"}';

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 11m;
    access_log /dev/stdout proxy_5xx if=$log_5xx;
    error_log /dev/stderr warn;

    location = /__loadtest_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /v2/local/search/keyword.json {
        access_log off;
        default_type application/json;
        return 200 '{"meta":{"is_end":true},"documents":[{"id":"loadtest-station","place_name":"강남역","address_name":"서울특별시 강남구 역삼동","road_address_name":"서울특별시 강남구 강남대로 396","x":"127.02756","y":"37.49795"}]}';
    }

    location = /map-reversegeocode/v2/gc {
        access_log off;
        default_type application/json;
        return 200 '{"status":{"code":0,"name":"ok","message":"done"},"results":[{"name":"roadaddr","region":{"area1":{"name":"서울특별시"},"area2":{"name":"강남구"},"area3":{"name":"역삼동"}},"land":{"name":"강남대로","number1":"396","number2":"","addition0":{"type":"building","value":"강남역"}}}]}';
    }

    location ^~ /actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
