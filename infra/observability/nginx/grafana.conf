server_tokens off;

resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name grafana.jucha.info;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://grafana.jucha.info$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name grafana.jucha.info;

    add_header X-Robots-Tag "noindex, nofollow" always;

    ssl_certificate /etc/letsencrypt/live/grafana.jucha.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.jucha.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location = /loki/api/v1/push {
        if ($request_method != POST) { return 404; }
        client_max_body_size 10m;
        auth_basic "Jumin telemetry ingestion";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_set_header Authorization "";
        set $loki_upstream http://loki:3100;
        proxy_pass $loki_upstream;
    }

    location = /prometheus/api/v1/write {
        if ($request_method != POST) { return 404; }
        client_max_body_size 10m;
        auth_basic "Jumin telemetry ingestion";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_set_header Authorization "";
        set $prometheus_upstream http://prometheus:9090;
        rewrite ^ /api/v1/write break;
        proxy_pass $prometheus_upstream;
    }

    location ^~ /loki/ {
        return 404;
    }

    location = /loki {
        return 404;
    }

    location ^~ /prometheus/ {
        return 404;
    }

    location = /prometheus {
        return 404;
    }

    location / {
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
