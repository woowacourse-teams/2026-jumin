spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:jumin}
spring.datasource.username=${DB_USERNAME:jumin}
spring.datasource.password=${DB_PASSWORD:jumin}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.flyway.enabled=true

local-search.base-url=${LOCAL_SEARCH_BASE_URL:https://dapi.kakao.com}
local-search.rest-api-key=${LOCAL_SEARCH_REST_API_KEY:}
