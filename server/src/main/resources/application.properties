spring.application.name=jumin
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{request.id}] %logger{36} - %msg %kvp%n
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
spring.jackson.time-zone=Asia/Seoul
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikari.connections.acquire=true
management.metrics.distribution.percentiles-histogram.jvm.gc.pause=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.percentiles-histogram.spring.data.repository.invocations=true
server.tomcat.mbeanregistry.enabled=true
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

local-search.base-url=${LOCAL_SEARCH_BASE_URL:https://dapi.kakao.com}
local-search.rest-api-key=${LOCAL_SEARCH_REST_API_KEY:}

reverse-geocoding.base-url=${REVERSE_GEOCODING_BASE_URL:https://maps.apigw.ntruss.com}
reverse-geocoding.client-id=${REVERSE_GEOCODING_CLIENT_ID}
reverse-geocoding.client-secret=${REVERSE_GEOCODING_CLIENT_SECRET}
admin.auth.login-id=${ADMIN_LOGIN_ID}
admin.auth.password-hash=${ADMIN_PASSWORD_HASH}
admin.auth.token-secret=${ADMIN_TOKEN_SECRET}
admin.auth.environment=${ADMIN_ENV_LABEL}
parking.availability.enabled=${PARKING_AVAILABILITY_ENABLED:false}
parking.availability.seoul.base-url=${SEOUL_PARKING_BASE_URL:http://openapi.seoul.go.kr:8088}
parking.availability.seoul.api-key=${SEOUL_PARKING_API_KEY:${SEOUL_OPEN_DATA_KEY:}}
parking.availability.busan.base-url=${BUSAN_PARKING_BASE_URL:https://apis.data.go.kr/B552587/ParkingInfoService_v2}
parking.availability.busan.api-key=${BUSAN_PARKING_API_KEY:}
