spring.application.name=jumin

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{request.id}] %logger{36} - %msg %kvp%n

spring.jpa.open-in-view=false

spring.jackson.time-zone=Asia/Seoul

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

local-search.base-url=${LOCAL_SEARCH_BASE_URL:https://naverapihub.apigw.ntruss.com}
local-search.client-id=${LOCAL_SEARCH_CLIENT_ID}
local-search.client-secret=${LOCAL_SEARCH_CLIENT_SECRET}
